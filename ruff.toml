target-version = "py312"
line-length = 88
extend-exclude = [
  ".adk",
  ".agents",
  ".codex",
  ".ruff_cache",
  ".venv",
  "__pycache__",
]

[lint]
select = [
  "E",
  "F",
  "B",
  "TID251",
]
ignore = [
  "E501",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[lint.flake8-tidy-imports.banned-api]
"builtins.object".msg = "Use a specific type instead of object."
"typing.Any".msg = "Use a specific type instead of Any."

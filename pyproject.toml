[project]
name = "pokedex-agent"
version = "0.1.0"
description = "A Pokédex-style AI agent built with Google ADK and PokéAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.3.0",
    "litellm>=1.90.3",
    "pokebase>=1.4.1",
    "pydantic>=2.13.4",
]

[project.scripts]
pokedex-agent = "pokedex_agent.agent:root_agent"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
